<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Royal College Art Circle</title>
    <meta
      name="description"
      content="The page you are looking for could not be found. Return to the Royal College Art Circle homepage."
    />
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/404.css" />
  </head>
  <body>
    <header class="not-found-header">
      <nav class="not-found-nav" aria-label="Main navigation">
        <a href="/" class="brand" aria-label="Royal College Art Circle home">
          <img src="/assets/logo.png" alt="Royal College Art Circle logo" />
        </a>

        <div class="nav-links">
          <a href="/">Home</a>
          <a href="/art-syllabus">Art Syllabus</a>
          <a href="/learning-portal">Learning Portal</a>
          <a href="/#projects">Projects</a>
        </div>
      </nav>
    </header>

    <main class="not-found-shell">
      <div class="not-found-card">
        <div class="eyebrow">404 Error</div>
        <h1>Page not found</h1>
        <p>
          The page you were looking for may have moved, been renamed, or is
          currently under development. Let&apos;s get you back to the Royal
          College Art Circle experience.
        </p>

        <div class="cta-row">
          <a href="/" class="primary-btn">
            <span class="material-symbols-outlined">home</span>
            Return home
          </a>
          <a href="/#projects" class="secondary-btn">Explore projects</a>
        </div>
      </div>
      <div class="error-badge" aria-label="404 code">404</div>
    </main>
  </body>
</html>
